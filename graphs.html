<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trail Data - Drew's Hike in Number Form</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Style the box around the plot */
    .plot-box {
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      width: 90%;              /* box takes 90% of parent width */
      max-width: 900px;        /* maximum width */
      margin: 20px auto;       /* center horizontally */
      background-color: #f9f9f9;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .plot-box h2 {
      text-align: center;
      margin-top: 0;
    }
     #scatterPlot {
      width: 100%;
      height: 60vh;  /* height relative to viewport for responsiveness */
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="include.js"></script>

  <div id="plots-container"></div>
  <script src="data-plots.js"></script>
</body>
</html>
